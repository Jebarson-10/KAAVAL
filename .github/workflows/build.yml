name: Build & Release KAAVAL

# ─────────────────────────────────────────────
#  Triggers
#    • push to main       → build only (CI check)
#    • pull_request       → build only (CI check)
#    • push of v* tag     → build THEN publish GitHub Release
#    • workflow_dispatch  → manual run
# ─────────────────────────────────────────────
on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'          # e.g.  v1.0.0 / v2.1.3-beta
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ───────────────────────────────────────────
  #  Job 1 — Lint (fast fail before heavy build)
  # ───────────────────────────────────────────
  lint:
    name: Syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install flake8
        run: pip install flake8

      - name: Lint — fail only on real errors (syntax + undefined names)
        run: |
          # E9   = syntax/runtime errors (SyntaxError, IndentationError…)
          # F821 = undefined name
          # F823 = local variable referenced before assignment
          flake8 kaaval/ --select=E9,F821,F823 --count --show-source --statistics

  # ───────────────────────────────────────────
  #  Job 2 — Build the Windows EXE
  # ───────────────────────────────────────────
  build:
    name: Build Windows EXE
    runs-on: windows-latest
    needs: lint           # only build if lint passes

    outputs:
      version: ${{ steps.get_version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      # ── Determine version string ──────────────
      - name: Get version
        id: get_version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="dev-$(git rev-parse --short HEAD)"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building version: ${VERSION}"

      # ── Python + deps ─────────────────────────
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller chromadb -r requirements.txt

      # ── Stamp version into the app ─────────────
      - name: Stamp version
        shell: bash
        env:
          KAAVAL_BUILD_VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          python -c "import os; from pathlib import Path; Path('kaaval/_version.py').write_text('__version__ = ' + repr(os.environ['KAAVAL_BUILD_VERSION']) + chr(10), encoding='utf-8')"

      - name: Smoke test application startup
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -c "import kaaval_app; from app import QApplication, MainWindow; application = QApplication([]); window = MainWindow(); window.show(); application.processEvents(); window.close()"

      # ── Build ─────────────────────────────────
      - name: Build with PyInstaller
        run: pyinstaller kaaval.spec --noconfirm

      # ── Rename EXE to include version ──────────
      - name: Rename EXE
        shell: bash
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          mv dist/KAAVAL.exe "dist/KAAVAL-${VERSION}.exe"
          echo "EXE renamed to KAAVAL-${VERSION}.exe"

      # ── Upload artifact (always) ───────────────
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: KAAVAL-${{ steps.get_version.outputs.version }}
          path: dist/KAAVAL-*.exe
          if-no-files-found: error
          retention-days: 30

  # ───────────────────────────────────────────
  #  Job 3 — Publish GitHub Release
  #           Runs ONLY on version tags (v*.*.*)
  # ───────────────────────────────────────────
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # ── Download the EXE built in job 2 ───────
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: KAAVAL-${{ needs.build.outputs.version }}
          path: dist/

      # ── Extract release notes from CHANGELOG ──
      - name: Read release notes
        shell: bash
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if [ -f CHANGELOG.md ]; then
            # Extract the section for this version between ## headers
            NOTES=$(awk -v version="$VERSION" '/^## / {if (found) exit; heading=$2; gsub(/^\[|\]$/, "", heading); found=(heading == version || "v" heading == version); next} found' CHANGELOG.md)
            if [ -z "$NOTES" ]; then
              NOTES="Release ${VERSION}"
            fi
          else
            NOTES="KAAVAL ${VERSION} — see commit history for details."
          fi
          # Write to file to avoid quoting issues
          echo "${NOTES}" > release_notes.txt
          cat release_notes.txt

      # ── Create the GitHub Release ──────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "KAAVAL ${{ needs.build.outputs.version }}"
          body_path: release_notes.txt
          draft: false
          prerelease: ${{ contains(needs.build.outputs.version, 'beta') || contains(needs.build.outputs.version, 'alpha') || contains(needs.build.outputs.version, 'rc') }}
          files: dist/KAAVAL-*.exe
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
