name: Build & Release KAAVAL

# ─────────────────────────────────────────────
#  Triggers
#    • push to main       → build only (CI check)
#    • pull_request       → build only (CI check)
#    • push of v* tag     → build THEN publish GitHub Release
#    • workflow_dispatch  → manual run
# ─────────────────────────────────────────────
on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'          # e.g.  v1.0.0 / v2.1.3-beta
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write          # needed to create GitHub Releases

jobs:
  # ───────────────────────────────────────────
  #  Job 1 — Lint (fast fail before heavy build)
  # ───────────────────────────────────────────
  lint:
    name: Syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pyflakes
        run: pip install pyflakes

      - name: Run pyflakes on kaaval package
        run: python -m pyflakes kaaval/

  # ───────────────────────────────────────────
  #  Job 2 — Build the Windows EXE
  # ───────────────────────────────────────────
  build:
    name: Build Windows EXE
    runs-on: windows-latest
    needs: lint           # only build if lint passes

    outputs:
      version: ${{ steps.get_version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      # ── Determine version string ──────────────
      - name: Get version
        id: get_version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="dev-$(git rev-parse --short HEAD)"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building version: ${VERSION}"

      # ── Python + deps ─────────────────────────
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      # ── Stamp version into the app ─────────────
      - name: Stamp version
        shell: bash
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          echo "__version__ = '${VERSION}'" > kaaval/_version.py
          echo "Stamped version: ${VERSION}"

      # ── Build ─────────────────────────────────
      - name: Build with PyInstaller
        run: pyinstaller kaaval.spec --noconfirm

      # ── Rename EXE to include version ──────────
      - name: Rename EXE
        shell: bash
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          mv dist/KAAVAL.exe "dist/KAAVAL-${VERSION}.exe"
          echo "EXE renamed to KAAVAL-${VERSION}.exe"

      # ── Upload artifact (always) ───────────────
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: KAAVAL-${{ steps.get_version.outputs.version }}
          path: dist/KAAVAL-*.exe
          retention-days: 30

  # ───────────────────────────────────────────
  #  Job 3 — Publish GitHub Release
  #           Runs ONLY on version tags (v*.*.*)
  # ───────────────────────────────────────────
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      # ── Download the EXE built in job 2 ───────
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: KAAVAL-${{ needs.build.outputs.version }}
          path: dist/

      # ── Extract release notes from CHANGELOG ──
      - name: Read release notes
        id: release_notes
        shell: bash
        run: |
          VERSION="${{ needs.build.outputs.version }}"
          if [ -f CHANGELOG.md ]; then
            # Extract the section for this version between ## headers
            NOTES=$(awk "/^## \[?${VERSION}\]?/{found=1; next} found && /^## /{exit} found{print}" CHANGELOG.md)
            if [ -z "$NOTES" ]; then
              NOTES="Release ${VERSION}"
            fi
          else
            NOTES="KAAVAL ${VERSION} — see commit history for details."
          fi
          # Write to file to avoid quoting issues
          echo "${NOTES}" > release_notes.txt
          cat release_notes.txt

      # ── Create the GitHub Release ──────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "KAAVAL ${{ needs.build.outputs.version }}"
          body_path: release_notes.txt
          draft: false
          prerelease: ${{ contains(needs.build.outputs.version, 'beta') || contains(needs.build.outputs.version, 'alpha') || contains(needs.build.outputs.version, 'rc') }}
          files: dist/KAAVAL-*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
